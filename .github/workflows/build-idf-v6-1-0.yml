name: P4 OLED firmware
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Host tests
        run: |
          c++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined commissioning/test_status_json.cpp -o /tmp/test_status
          /tmp/test_status
          c++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined commissioning/test_config_validation.cpp -o /tmp/test_config
          /tmp/test_config
          c++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined commissioning/test_config_compat.cpp -o /tmp/test_compat
          /tmp/test_compat
      - name: Build P4 revision 3.1+
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32p4
          command: |
            python commissioning/provision_admin.py
            python commissioning/provision_ntp_auth.py
            python commissioning/provision_tls.py
            idf.py -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;config/esp32p4_rev_v3_1.defaults' set-target esp32p4 build
      # No binaries or bootstrap credentials are uploaded as artifacts.
